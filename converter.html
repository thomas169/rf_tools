<div class="tab-bar">
    <button class="tab-button active" onclick="showTab('analysisTab', this)">Analysis</button>
    <button class="tab-button" onclick="showTab('importTab', this)">Import RF</button>
</div>
<div id="analysisTab" class="tab-content">
    <div class="section">
        <h3>Input</h3>
        <textarea id="binaryInput" spellcheck="false"></textarea>
        <br>
        <label>Convert from:</label>
        <select id="convertIp" class="small-select">
            <option value="0">Auto</option>
            <option value="1">binary</option>
            <option value="2">hex</option>
        </select>
        <label>Convert to:</label>
        <select id="convertOp" class="small-select">
            <option value="0">Auto</option>
            <option value="1">binary</option>
            <option value="2">hex</option>
        </select>
        <br>
        <label>Shift Level:</label>
        <select id="shiftLvl" class="small-select">
            <option value="0">0</option>
            <option value="1">1</option>
        </select>
        <label>Shift Direction:</label>
        <select id="shiftDir" class="small-select">
            <option value="0">Left</option>
            <option value="1">Right</option>
        </select>
        <br>
        <label>Manchester Convention:</label>
            <select id="manchesterMode" class="small-select">
            <option value="1">Manchester 1 (01=1, 10=0)</option>
            <option value="2">Manchester 2 (10=1, 01=0)</option>
        </select>
        <br>
        <label>Differential Manchester Initial Level:</label>
        <select id="diffInit" class="small-select">
            <option value="0">0</option>
            <option value="1">1</option>
        </select>
        <br>
        <label>Keeloq Code:</label>
        <select id="keeloqInvert" class="small-select">
            <option value="0">Normal (110=1, 100=0)</option>
            <option value="1">Alt (100=1, 110=0)</option>
        </select>
        <h3>
            Custom Script
            <span
                title="Available variables and functions for custom scripts:
        bits      -> get input as binary string
        hex       -> get input as hex string
        output(x) -> append to Results
        hexOf(x)  -> convert binary to hex

    Return a string via the output(x) function.
    The script runs once for each input line. JavaScript."
                style="cursor: help;"
            >ⓘ</span>
        </h3>
        <textarea id="customScript" spellcheck="false" rows="16">
    function x() {
    z = [];
    for (bit of bits) {
        z.push(bit)
    }
    z = z.join().replaceAll(",","");
    return z;
    }

    output(x());
        </textarea>
        <br>
        <h3>Actions</h3>
        <button onclick="convert()">Convert</button>
        <button onclick="shiftBits()">Shift Bits</button>
        <button onclick="decodeManchester()">Decode Manchester</button>
        <button onclick="decodeDiffManchester()">Decode Differential Manchester</button>
        <button onclick="decodeKeeloq()">Decode Keeloq</button>
        <button onclick="encodeManchester()">Encode Manchester</button>
        <button onclick="encodeDiffManchester()">Encode Differential Manchester</button>
        <button onclick="encodeKeeloq()">Encode Keeloq</button>
        <button onclick="runCustomScript()">Run Custom Script</button>
        <h3>Results</h3>
        <div class="results" id="results"></div>
    </div>
</div>

<div id="importTab" class="tab-content" style="display:none;">
    <div class="section">
        <h3>RF Import</h3>
        <label>Format</label>
        <select id="format">
            <option value="0">Complex Int8</option>
            <option value="1">Complex UInt8 (RTL-SDR)</option>
            <option value="2">Complex Int16</option>
            <option value="3">Complex Float32</option>
        </select>
        <label>Order</label>
        <select id="order">
            <option value="0">IQ</option>
            <option value="1">QI</option>
        </select>
        <label>Endianness:</label>
        <select id="endianness">
            <option value="0">Big</option>
            <option value="1">Small</option>
        </select>
        <button onclick="importRfFile()">Open RF File...</button>
        <h3>Signal Preview</h3>
        <div class="graph-container">
            <canvas id="signalGraph" width="2500" height="220"></canvas>
        </div>
        <h3>Capture</h3>
        <div class="setting">
            <label>Mod Format:</label>
            <select id="order">
                <option value="0">ASK</option>
                <option value="1">FSK</option>
            </select>
        </div>
        <div class="setting">
            <label>Center:</label>
            <input id="mod_center" type="number" value="1000000">
        </div>
        <div class="setting">
            <label>Sample Rate (Hz):</label>
            <input id="sampleRate" type="number" value="1000000">
        </div>
        <div class="setting">
            <label>Decimation:</label>
            <input id="decimation" type="number" value="1">
        </div>
        <div class="setting">
            <label>Noise Threshold:</label>
            <input id="noiseThreshold" type="number" value="-1">
        </div>
        <div class="setting">
            <label>Break after (zeros)</label>
            <input id="zeroBreak" type="number" value="50">
        </div>
        <div class="setting">
            <label>Minimum Burst Length:</label>
            <input id="minBurst" type="number" value="20">
        </div>
        <h3>Actions</h3>
        <button id="demodBtn" onclick="demodulateIQ()">Demodulate</button>
        <button id="pushBtn" onclick="moveToAnalysis()">Push to Analysis</button>
        <h3>Demodulated Bits</h3>
        <div class="demod_results" id="demod_results"></div>
    </div>
</div>
<div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="spinner"></div>
    <div>Parsing IQ file...</div>
</div>
</body>
